<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D Wiki</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: "STKaiti", "KaiTi", "STSong", "SimSun", "Noto Serif SC", serif;
      background: #f5f0e8;
      min-height: 100vh;
      padding-bottom: 100px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* 宣纸纹理 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23paper)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }
    
    /* 水墨山水背景 */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg width='1400' height='900' viewBox='0 0 1400 900' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='m1' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%235a5650' stop-opacity='0.04'/%3E%3Cstop offset='100' stop-color='%235a5650' stop-opacity='0.01'/%3E%3C/linearGradient%3E%3ClinearGradient id='m2' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234a4640' stop-opacity='0.06'/%3E%3Cstop offset='100' stop-color='%234a4640' stop-opacity='0.015'/%3E%3C/linearGradient%3E%3ClinearGradient id='m3' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%233a3630' stop-opacity='0.08'/%3E%3Cstop offset='100' stop-color='%233a3630' stop-opacity='0.02'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M0,580 Q80,500 180,530 Q280,480 380,510 Q480,460 580,490 Q680,440 780,470 Q880,430 980,460 Q1080,420 1180,450 Q1280,430 1400,460 L1400,900 L0,900 Z' fill='url(%23m1)'/%3E%3Cpath d='M0,640 Q120,580 240,610 Q360,560 480,590 Q600,540 720,570 Q840,530 960,560 Q1080,520 1200,550 Q1300,530 1400,555 L1400,900 L0,900 Z' fill='url(%23m2)'/%3E%3Cpath d='M0,710 Q100,670 220,690 Q340,650 460,680 Q580,640 700,670 Q820,630 940,660 Q1060,620 1180,650 Q1300,630 1400,655 L1400,900 L0,900 Z' fill='url(%23m3)'/%3E%3Cellipse cx='350' cy='560' rx='200' ry='20' fill='%23f5f0e8' opacity='0.5'/%3E%3Cellipse cx='800' cy='590' rx='250' ry='25' fill='%23f5f0e8' opacity='0.4'/%3E%3Cellipse cx='1150' cy='540' rx='160' ry='18' fill='%23f5f0e8' opacity='0.35'/%3E%3C/svg%3E");
      background-size: cover;
      background-position: center bottom;
      pointer-events: none;
      z-index: 0;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #2c2c2c 0%, #3a3630 30%, transparent 100%);
      padding-bottom: 40px;
    }
    
    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 20% 0%, rgba(90,86,80,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 0%, rgba(90,86,80,0.1) 0%, transparent 50%);
    }
    
    .header-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    
    h1 {
      font-size: 28px;
      color: #f5f0e8;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(245,240,232,0.15), 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .username {
      font-size: 14px;
      color: rgba(245,240,232,0.6);
      letter-spacing: 1px;
    }
    
    .logout-btn {
      font-size: 14px;
      color: rgba(245,240,232,0.6);
      border: 1px solid rgba(245,240,232,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      background: transparent;
      font-family: inherit;
    }
    
    .logout-btn:hover {
      color: #f5f0e8;
      border-color: rgba(245,240,232,0.5);
    }
    
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    
    .date-picker {
      background: rgba(255,252,245,0.92);
      border: 1px solid rgba(90,86,80,0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(44,44,44,0.04), 0 4px 12px rgba(44,44,44,0.02);
    }
    
    .date-label {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      background: rgba(139,69,19,0.08);
      color: #8b4513;
      border: 1px solid rgba(139,69,19,0.15);
      border-radius: 4px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    
    input[type="date"] {
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(90,86,80,0.12);
      font-size: 20px;
      color: #2c2c2c;
      font-family: inherit;
    }
    
    input[type="date"]:focus {
      outline: none;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 24px;
      position: relative;
    }
    
    .tab {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      letter-spacing: 2px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #9a9590;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    
    .tab.active {
      color: #2c2c2c;
      font-weight: 600;
      border-bottom-color: #2c2c2c;
    }
    
    .entries-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .entry-card {
      background: rgba(255,252,245,0.92);
      border: 1px solid rgba(90,86,80,0.08);
      border-left: 3px solid rgba(90,86,80,0.2);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 1px 3px rgba(44,44,44,0.03);
    }
    
    .entry-card:hover {
      box-shadow: 0 2px 8px rgba(44,44,44,0.06);
      border-left-color: rgba(90,86,80,0.35);
    }
    
    .entry-content {
      font-size: 16px;
      line-height: 1.6;
      color: #2c2c2c;
    }
    
    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }
    
    .todo-checkbox {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid rgba(90,86,80,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 2px;
    }
    
    .todo-checkbox.completed {
      background: #2c2c2c;
      border: none;
    }
    
    .todo-checkbox.completed::after {
      content: '✓';
      color: #f5f0e8;
      font-size: 12px;
      font-weight: bold;
    }
    
    .todo-text {
      flex: 1;
      font-size: 16px;
      line-height: 1.5;
      color: #2c2c2c;
    }
    
    .todo-text.completed {
      color: #9a9590;
      text-decoration: line-through;
    }
    
    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(90,86,80,0.06);
    }
    
    .expense-item:last-child {
      border-bottom: none;
    }
    
    .expense-name {
      font-size: 16px;
      color: #2c2c2c;
    }
    
    .expense-amount {
      font-size: 16px;
      font-weight: 500;
      color: #5a5650;
    }
    
    .expense-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px solid rgba(90,86,80,0.1);
    }
    
    .expense-total-label {
      font-size: 14px;
      color: #6a6560;
      letter-spacing: 1px;
    }
    
    .expense-total-amount {
      font-size: 18px;
      font-weight: 500;
      color: #2c2c2c;
    }
    
    .daily-total {
      margin-top: 24px;
      padding: 20px;
      background: rgba(255,252,245,0.92);
      border: 1px solid rgba(90,86,80,0.08);
      border-top: 2px solid rgba(90,86,80,0.12);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(44,44,44,0.03);
    }
    
    .daily-total-label {
      font-size: 14px;
      color: #6a6560;
      letter-spacing: 2px;
    }
    
    .daily-total-amount {
      font-size: 24px;
      font-weight: 500;
      color: #2c2c2c;
    }
    
    .monthly-stats-btn {
      margin-top: 12px;
      padding: 10px 20px;
      background: transparent;
      color: #5a5650;
      border: 1px solid rgba(90,86,80,0.2);
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      width: 100%;
    }
    
    .monthly-stats-btn:hover {
      background: rgba(90,86,80,0.04);
      border-color: rgba(90,86,80,0.3);
    }
    
    .stats-modal-body {
      padding: 24px;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .stats-summary {
      background: rgba(139,69,19,0.05);
      border: 1px solid rgba(139,69,19,0.15);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .stats-summary-label {
      font-size: 12px;
      color: #6a6560;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .stats-summary-amount {
      font-size: 28px;
      font-weight: 500;
      color: #8b4513;
    }
    
    .stats-section {
      margin-bottom: 24px;
    }
    
    .stats-section-title {
      font-size: 14px;
      color: #2c2c2c;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(90,86,80,0.1);
    }
    
    .stats-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255,252,245,0.6);
      border: 1px solid rgba(90,86,80,0.06);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .stats-item-label {
      font-size: 14px;
      color: #5a5650;
    }
    
    .stats-item-amount {
      font-size: 14px;
      font-weight: 500;
      color: #2c2c2c;
    }
    
    /* 笔记统计样式 */
    .stats-note-day {
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(255,252,245,0.6);
      border: 1px solid rgba(90,86,80,0.06);
      border-radius: 8px;
    }
    
    .stats-note-date {
      font-size: 13px;
      color: #8b4513;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    
    .stats-note-content {
      font-size: 14px;
      color: #2c2c2c;
      line-height: 1.6;
      padding: 6px 0;
      border-bottom: 1px solid rgba(90,86,80,0.05);
    }
    
    .stats-note-content:last-child {
      border-bottom: none;
    }
    
    /* 待办统计样式 */
    .stats-todo-overview {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stats-todo-stat {
      flex: 1;
      padding: 16px;
      background: rgba(255,252,245,0.6);
      border: 1px solid rgba(90,86,80,0.08);
      border-radius: 8px;
      text-align: center;
    }
    
    .stats-todo-stat-label {
      font-size: 12px;
      color: #6a6560;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .stats-todo-stat-value {
      font-size: 24px;
      font-weight: 500;
    }
    
    .stats-todo-stat-value.completed {
      color: #28a745;
    }
    
    .stats-todo-stat-value.pending {
      color: #8b4513;
    }
    
    .stats-todo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255,252,245,0.6);
      border: 1px solid rgba(90,86,80,0.06);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .stats-todo-item.completed {
      opacity: 0.7;
    }
    
    .stats-todo-item.completed .stats-todo-text {
      text-decoration: line-through;
      color: #9a9590;
    }
    
    .stats-todo-item.pending .stats-todo-text {
      color: #2c2c2c;
    }
    
    .stats-todo-text {
      font-size: 14px;
      flex: 1;
    }
    
    .stats-todo-date {
      font-size: 12px;
      color: #9a9590;
      margin-left: 12px;
    }
    
    .empty-state {
      text-align: center;
      padding: 100px 20px;
    }
    
    .empty-text {
      font-size: 20px;
      color: #9a9590;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    
    .add-btn {
      padding: 12px 32px;
      background: #2c2c2c;
      color: #f5f0e8;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    
    .add-btn:hover {
      background: #3a3630;
    }
    
    /* flatpickr 自定义样式 */
    .flatpickr-calendar {
      font-family: "STKaiti", "KaiTi", "STSong", "SimSun", "Noto Serif SC", serif;
      border: 1px solid rgba(90,86,80,0.1);
      box-shadow: 0 4px 20px rgba(44,44,44,0.1);
      border-radius: 12px;
    }
    
    .flatpickr-day {
      border-radius: 6px;
      position: relative;
    }
    
    .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
      background: #2c2c2c;
      border-color: #2c2c2c;
    }
    
    .flatpickr-day.today {
      border-color: #8b4513;
    }
    
    .flatpickr-day:hover {
      background: rgba(90,86,80,0.08);
    }
    
    /* 月份导航样式 */
    .flatpickr-months {
      background: rgba(255,252,245,0.5);
      border-bottom: 1px solid rgba(90,86,80,0.08);
    }
    
    .flatpickr-month {
      color: #2c2c2c;
      fill: #2c2c2c;
    }
    
    .flatpickr-current-month {
      font-size: 16px;
      font-weight: 500;
      color: #2c2c2c;
    }
    
    .flatpickr-current-month input.cur-year {
      color: #2c2c2c;
      font-family: inherit;
    }
    
    /* 静态月份选择器样式 */
    .flatpickr-monthDropdown-months {
      display: flex !important;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      font-size: 14px !important;
    }
    
    .flatpickr-monthDropdown-months .flatpickr-monthDropdown-month {
      padding: 4px 8px !important;
      border-radius: 4px !important;
      cursor: pointer !important;
      transition: all 0.3s !important;
      background: transparent !important;
      color: #5a5650 !important;
    }
    
    .flatpickr-monthDropdown-months .flatpickr-monthDropdown-month:hover {
      background: rgba(90,86,80,0.08) !important;
      color: #2c2c2c !important;
    }
    
    .flatpickr-monthDropdown-months .flatpickr-monthDropdown-month.selected {
      background: #2c2c2c !important;
      color: #f5f0e8 !important;
      font-weight: 500;
    }
    
    .flatpickr-prev-month, .flatpickr-next-month {
      color: #5a5650;
      fill: #5a5650;
      border-radius: 6px;
      padding: 6px;
    }
    
    .flatpickr-prev-month:hover, .flatpickr-next-month:hover {
      background: rgba(90,86,80,0.08);
      color: #2c2c2c;
      fill: #2c2c2c;
    }
    
    .flatpickr-prev-month svg, .flatpickr-next-month svg {
      width: 14px;
      height: 14px;
    }
    
    .numInputWrapper {
      background: transparent;
    }
    
    .numInputWrapper:hover {
      background: rgba(90,86,80,0.05);
    }
    
    .numInputWrapper span {
      border-color: rgba(90,86,80,0.2);
    }
    
    .numInputWrapper span:hover {
      background: rgba(90,86,80,0.08);
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(44,44,44,0.3);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    
    .modal-overlay.show {
      display: flex;
    }
    
    .modal {
      background: #faf7f0;
      border: 1px solid rgba(90,86,80,0.1);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(44,44,44,0.1);
    }
    
    .modal-header {
      padding: 24px;
      border-bottom: 1px solid rgba(90,86,80,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 500;
      color: #2c2c2c;
      letter-spacing: 2px;
    }
    
    .modal-close {
      background: transparent;
      border: none;
      font-size: 24px;
      color: #9a9590;
      cursor: pointer;
      padding: 6px;
      transition: color 0.3s;
    }
    
    .modal-close:hover {
      color: #2c2c2c;
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-size: 12px;
      color: #6a6560;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    
    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,252,245,0.8);
      border: 1px solid rgba(90,86,80,0.12);
      border-radius: 8px;
      font-size: 16px;
      color: #2c2c2c;
      font-family: inherit;
    }
    
    .form-textarea {
      resize: none;
      min-height: 120px;
      line-height: 1.6;
    }
    
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: rgba(90,86,80,0.3);
    }
    
    .todo-edit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,252,245,0.8);
      border: 1px solid rgba(90,86,80,0.08);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    
    .todo-edit-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      accent-color: #2c2c2c;
    }
    
    .todo-edit-item span {
      flex: 1;
      font-size: 16px;
      color: #2c2c2c;
    }
    
    .todo-edit-item span.completed {
      color: #9a9590;
      text-decoration: line-through;
    }
    
    .todo-edit-item button {
      background: transparent;
      border: none;
      color: #9a9590;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.3s;
    }
    
    .todo-edit-item button:hover {
      color: #8b4513;
    }
    
    .add-todo-row {
      display: flex;
      gap: 8px;
    }
    
    .add-todo-row input {
      flex: 1;
      padding: 10px 16px;
      background: rgba(255,252,245,0.8);

  <script>
    // 调试功能
    let debugMode = localStorage.getItem('debugMode') === 'true'
    let debugPressTimer = null
    let debugPressStartTime = 0
    
    function debugLog(message, type = 'info') {
      if (!debugMode) return
      const debugContent = document.getElementById('debugContent')
      if (!debugContent) return
      const entry = document.createElement('div')
      entry.className = `debug-log-entry ${type}`
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 })
      entry.innerHTML = `<span class="debug-log-time">[${time}]</span><span class="debug-log-msg">${message}</span>`
      debugContent.appendChild(entry)
      debugContent.scrollTop = debugContent.scrollHeight
      console.log(`[DEBUG] ${message}`)
      
      // 保存日志到 localStorage
      const logs = JSON.parse(localStorage.getItem('debugLogs') || '[]')
      logs.push({ time, message, type })
      localStorage.setItem('debugLogs', JSON.stringify(logs))
    }
    
    function clearDebugLogs() {
      const debugContent = document.getElementById('debugContent')
      if (debugContent) debugContent.innerHTML = ''
      localStorage.setItem('debugLogs', '[]')
    }

    function restoreDebugLogs() {
      const logs = JSON.parse(localStorage.getItem('debugLogs') || '[]')
      const debugContent = document.getElementById('debugContent')
      if (!debugContent) return
      logs.forEach(log => {
        const entry = document.createElement('div')
        entry.className = `debug-log-entry ${log.type}`
        entry.innerHTML = `<span class="debug-log-time">[${log.time}]</span><span class="debug-log-msg">${log.message}</span>`
        debugContent.appendChild(entry)
      })
      if (logs.length > 0) {
        debugContent.scrollTop = debugContent.scrollHeight
      }
    }
    
    function toggleDebugMode() {
      debugMode = !debugMode
      localStorage.setItem('debugMode', debugMode)
      const panel = document.getElementById('debugPanel')
      if (debugMode) {
        panel.classList.add('show')
        debugLog('调试模式已开启', 'success')
        initDraggablePanel()
      } else {
        panel.classList.remove('show')
      }
    }

    function closeDebugPanel() {
      debugMode = false
      localStorage.setItem('debugMode', 'false')
      const panel = document.getElementById('debugPanel')
      if (panel) {
        panel.classList.remove('show')
      }
    }
    
    function initDraggablePanel() {
      const panel = document.getElementById('debugPanel')
      const header = document.getElementById('debugHeader')
      let isDragging = false
      let startX, startY, initialLeft, initialTop
      
      // 鼠标拖动
      header.addEventListener('mousedown', (e) => {
        isDragging = true
        const rect = panel.getBoundingClientRect()
        startX = e.clientX
        startY = e.clientY
        initialLeft = rect.left
        initialTop = rect.top
        panel.style.right = 'auto'
        panel.style.bottom = 'auto'
        panel.style.left = initialLeft + 'px'
        panel.style.top = initialTop + 'px'
        e.preventDefault()
      })
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return
        const deltaX = e.clientX - startX
        const deltaY = e.clientY - startY
        panel.style.left = (initialLeft + deltaX) + 'px'
        panel.style.top = (initialTop + deltaY) + 'px'
      })
      
      document.addEventListener('mouseup', () => {
        isDragging = false
      })
      
      // 触摸拖动（移动端）
      header.addEventListener('touchstart', (e) => {
        isDragging = true
        const touch = e.touches[0]
        const rect = panel.getBoundingClientRect()
        startX = touch.clientX
        startY = touch.clientY
        initialLeft = rect.left
        initialTop = rect.top
        panel.style.right = 'auto'
        panel.style.bottom = 'auto'
        panel.style.left = initialLeft + 'px'
        panel.style.top = initialTop + 'px'
      }, { passive: true })
      
      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return
        const touch = e.touches[0]
        const deltaX = touch.clientX - startX
        const deltaY = touch.clientY - startY
        panel.style.left = (initialLeft + deltaX) + 'px'
        panel.style.top = (initialTop + deltaY) + 'px'
        e.preventDefault()
      }, { passive: false })
      
      document.addEventListener('touchend', () => {
        isDragging = false
      })
    }
    
    // 恢复调试面板状态
    if (debugMode) {
      const panel = document.getElementById('debugPanel')

    // 格式化日期显示

    async function fetchEntries() {

        .from('journal_entries')

      if (error) {

        content.innerHTML = '<div class="empty-state"><div class="empty-text">加载失败</div></div>'

      currentEntries = data || []

    function renderEntries() {
      const content = document.getElementById('content')
      const filtered = currentEntries.filter(e => e.entry_type === activeTab)

          const items = parseExpenseItems(entry.content)
          const total = items.reduce((sum, item) => sum + (item.amount || 0), 0)
          return `<div class="entry-card" onclick="handleEntryClick('${entry.id}')">
            ${items.map(item => `
              <div class="expense-item">
                <span class="expense-name">${item.name}</span>
                <span class="expense-amount">¥${item.amount.toFixed(2)}</span>
              </div>
            `).join('')}
            <div class="expense-total">
              <span class="expense-total-label">小计</span>
              <span class="expense-total-amount">¥${total.toFixed(2)}</span>
            </div>
          </div>`
        } else {
          return `<div class="entry-card" onclick="handleEntryClick('${entry.id}')">
            <div class="entry-content">${entry.content}</div>
          </div>`
        }
      }).join('')
      
      // 显示今日总开销
      if (activeTab === 'expense') {
        const expenses = currentEntries.filter(e => e.entry_type === 'expense')
        const totalExpense = expenses.reduce((sum, e) => {
          const items = parseExpenseItems(e.content)
          return sum + items.reduce((s, item) => s + (item.amount || 0), 0)
        }, 0)
        
        if (totalExpense > 0) {
          content.innerHTML += `<div class="daily-total">
            <div class="daily-total-label">今日总开销</div>
            <div class="daily-total-amount">¥${totalExpense.toFixed(2)}</div>
          </div>`
        }
        
        // 添加统计本月按钮
        content.innerHTML += `<button class="monthly-stats-btn" onclick="showMonthlyStats()">统计本月</button>`
      } else if (activeTab === 'note') {
        content.innerHTML += `<button class="monthly-stats-btn" onclick="showNoteMonthlyStats()">统计本月</button>`
      } else if (activeTab === 'todo') {
        content.innerHTML += `<button class="monthly-stats-btn" onclick="showTodoMonthlyStats()">统计本月</button>`
      }
    }
    
    function parseTodoItems(content) {
      try {
        const parsed = JSON.parse(content)
        if (parsed.items && Array.isArray(parsed.items)) {
          return parsed.items
        }
      } catch {}
      if (content.trim()) {
        return [{ text: content, completed: false }]
      }
      return []
    }
    
    function parseExpenseItems(content) {
      try {
        const parsed = JSON.parse(content)
        if (parsed.items && Array.isArray(parsed.items)) {
          return parsed.items
        }
      } catch {}
      return []
    }

    async function saveEdit() {
      if (!editingEntry) return
      debugLog('开始保存记录...', 'info')
      
      const payload = {
        user_id: currentUser.id,
        entry_date: selectedDate,
        entry_type: editingEntry.entry_type
      }
      
      if (editingEntry.entry_type === 'note') {
        const content = document.getElementById('editContent').value.trim()
        if (!content) return
        payload.content = content
      } else if (editingEntry.entry_type === 'todo') {
        if (todoItems.length === 0) return
        payload.content = JSON.stringify({ items: todoItems })
      } else if (editingEntry.entry_type === 'expense') {
        if (expenseItems.length === 0) return
        payload.content = JSON.stringify({ items: expenseItems })
        payload.amount = expenseItems.reduce((sum, item) => sum + (item.amount || 0), 0)
      }
      
      try {
        if (editingEntry.id) {
          debugLog(`更新记录 ID: ${editingEntry.id}`, 'info')
          // 获取更新前的内容
          const { data: oldData, error: oldError } = await supabase
            .from('journal_entries')
            .select('content')
            .eq('id', editingEntry.id)
            .single()
          
          if (oldError) {
            debugLog(`获取旧内容失败: ${oldError.message}`, 'error')
            throw oldError
          }
          
          // 更新记录
          const { error } = await supabase
            .from('journal_entries')
            .update(payload)
            .eq('id', editingEntry.id)
          
          if (error) {
            debugLog(`更新记录失败: ${error.message}`, 'error')
            throw error
          }
          debugLog('记录更新成功', 'success')
          
          // 记录历史（如果内容有变化）
          const contentBefore = oldData?.content || ''
          const contentAfter = payload.content || ''
          if (contentBefore !== contentAfter) {
            debugLog('检测到内容变化，记录历史...', 'info')
            const { error: historyError } = await supabase
              .from('edit_history')
              .insert({
                entry_id: editingEntry.id,
                user_id: currentUser.id,
                content_before: contentBefore,
                content_after: contentAfter,
                edited_at: new Date().toISOString()
              })
            
            if (historyError) {
              debugLog(`记录历史失败: ${historyError.message}`, 'error')
              console.error('Failed to save edit history:', historyError)
            } else {
              debugLog('历史记录保存成功', 'success')
            }
          }
        } else {
          debugLog('创建新记录...', 'info')
          const { error } = await supabase
            .from('journal_entries')
            .insert(payload)
          
          if (error) {
            debugLog(`创建记录失败: ${error.message}`, 'error')
            throw error
          }
          debugLog('新记录创建成功', 'success')
        }
        
        closeEditModal()
        await fetchEntries()
      } catch (err) {
        debugLog(`保存失败: ${err.message}`, 'error')
        alert('保存失败: ' + err.message)
      }
    }
    
    async function toggleTodoComplete(entryId, itemIndex) {
      const entry = currentEntries.find(e => e.id === entryId)
      if (!entry) return
      
      const items = parseTodoItems(entry.content)
      items[itemIndex].completed = !items[itemIndex].completed
      const newContent = JSON.stringify({ items })
      
      const { error } = await supabase
        .from('journal_entries')
        .update({ content: newContent })
        .eq('id', entryId)
      
      if (error) {
        alert('更新失败: ' + error.message)
        return
      }
      
      await fetchEntries()
    }

    async function showMonthlyStats() {
      debugLog('开始加载本月统计...', 'info')
      const statsBody = document.getElementById('statsBody')
      statsBody.innerHTML = '<div class="loading">载入中...</div>'
      document.getElementById('statsModal').classList.add('show')
      
      // 获取本月第一天和选择的日期（作为截止日期）
      const selectedDateObj = new Date(selectedDate)
      const year = selectedDateObj.getFullYear()
      const month = selectedDateObj.getMonth()
      const startDate = `${year}-${String(month + 1).padStart(2, '0')}-01`
      const endDate = selectedDate // 使用选择的日期作为截止日期
      
      debugLog(`查询日期范围: ${startDate} 到 ${endDate}`, 'info')
      
      // 查询本月所有开销
      const { data, error } = await supabase
        .from('journal_entries')
        .select('*')
        .eq('user_id', currentUser.id)
        .eq('entry_type', 'expense')
        .gte('entry_date', startDate)
        .lte('entry_date', endDate)
        .order('entry_date', { ascending: true })
      
      if (error) {
        debugLog(`查询失败: ${error.message}`, 'error')
        statsBody.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: #9a9590;">加载失败</div>'
        return
      }
      
      debugLog(`查询到 ${data.length} 条记录`, 'success')
      
      // 计算总额
      let totalAmount = 0
      const dailyStats = {} // 按天聚合
      const categoryStats = {} // 按事件聚合
      
      data.forEach(entry => {
        const items = parseExpenseItems(entry.content)
        const date = entry.entry_date
        
        if (!dailyStats[date]) {
          dailyStats[date] = { total: 0, items: [] }
        }
        
        items.forEach(item => {
          const amount = item.amount || 0
          totalAmount += amount
          dailyStats[date].total += amount
          dailyStats[date].items.push(item)
          
          // 按事件名称聚合
          if (!categoryStats[item.name]) {
            categoryStats[item.name] = 0
          }
          categoryStats[item.name] += amount
        })
      })
      
      // 格式化日期显示（如：10月1日）
      const formatDate = (dateStr) => {
        const d = new Date(dateStr)
        return `${d.getMonth() + 1}月${d.getDate()}日`
      }
      
      // 渲染统计结果
      let html = `
        <div class="stats-summary">
          <div class="stats-summary-label">${formatDate(startDate)} 至 ${formatDate(endDate)} 总开销</div>
          <div class="stats-summary-amount">¥${totalAmount.toFixed(2)}</div>
        </div>
      `
      
      // 按天统计
      const dailyEntries = Object.entries(dailyStats).sort((a, b) => b[0].localeCompare(a[0]))
      if (dailyEntries.length > 0) {
        html += `<div class="stats-section">
          <div class="stats-section-title">每日明细</div>`
        dailyEntries.forEach(([date, stats]) => {
          html += `<div class="stats-item">
            <span class="stats-item-label">${formatDate(date)}</span>
            <span class="stats-item-amount">¥${stats.total.toFixed(2)}</span>
          </div>`
        })
        html += `</div>`
      }
      
      // 按事件统计
      const categoryEntries = Object.entries(categoryStats).sort((a, b) => b[1] - a[1])
      if (categoryEntries.length > 0) {
        html += `<div class="stats-section">
          <div class="stats-section-title">事件统计</div>`
        categoryEntries.forEach(([name, amount]) => {
          html += `<div class="stats-item">
            <span class="stats-item-label">${name}</span>
            <span class="stats-item-amount">¥${amount.toFixed(2)}</span>
          </div>`
        })
        html += `</div>`
      }
      
      if (data.length === 0) {
        html += '<div style="text-align: center; padding: 60px 20px; color: #9a9590; letter-spacing: 2px;">本月暂无开销记录</div>'
      }
      
      statsBody.innerHTML = html
    }

        html += `<div class="stats-section">
          <div class="stats-section-title">待完成 (${pendingCount})</div>`
        pendingTodos.forEach(todo => {
          html += `<div class="stats-todo-item pending">
            <span class="stats-todo-text">${todo.text}</span>
            <span class="stats-todo-date">${formatDate(todo.date)}</span>
          </div>`
        })
        html += `</div>`
      }
      
      // 按天显示
      const dailyEntries = Object.entries(dailyTodos).sort((a, b) => b[0].localeCompare(a[0]))
      if (dailyEntries.length > 0) {
        html += `<div class="stats-section">
          <div class="stats-section-title">每日明细</div>`
        dailyEntries.forEach(([date, todos]) => {
          html += `<div class="stats-note-day">
            <div class="stats-note-date">${formatDate(date)}</div>
            ${todos.map(todo => `<div class="stats-todo-item ${todo.completed ? 'completed' : 'pending'}">
              <span class="stats-todo-text">${todo.text}</span>
            </div>`).join('')}
          </div>`
        })
        html += `</div>`
      }
      
      if (data.length === 0) {
        html += '<div style="text-align: center; padding: 60px 20px; color: #9a9590; letter-spacing: 2px;">本月暂无待办记录</div>'
      }
      
      statsBody.innerHTML = html
    }
    
    async function handleLogout() {
      debugLog('执行登出操作...', 'info')
      await supabase.auth.signOut()
      localStorage.removeItem('supabase.auth.token')
      debugLog('登出成功，跳转到登录页', 'success')
      window.location.href = 'login.html'
    }
    
    // 全局函数
    window.createNewEntry = createNewEntry
    window.handleEntryClick = handleEntryClick
    window.toggleTodo = toggleTodoComplete
    window.addTodoItem = addTodoItem
    window.addExpenseItem = addExpenseItem
    window.renderTodoList = renderTodoList
    window.renderExpenseList = renderExpenseList
    window.showMonthlyStats = showMonthlyStats
    window.showNoteMonthlyStats = showNoteMonthlyStats
    window.showTodoMonthlyStats = showTodoMonthlyStats
    
    init()
    
    } catch (err) {
      alert('初始化错误: ' + err.message)
      console.error('Init error:', err)
    }
  </script>
</body>
</html>
